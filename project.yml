name: Coherence

fileGroups:
  - CLAUDE.md
  - README.md
  - project.yml
  - App_ROADMAP_v2.md

options:
  bundleIdPrefix: com.lockout
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # Set in Xcode (Signing & Capabilities)
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: 6.27.0

targets:
  Coherence:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Coherence
      - Shared
      - path: PURPOSE.md
        buildPhase: resources
      - path: SCIENCE.md
        buildPhase: resources
      - path: PRIVACY_POLICY.md
        buildPhase: resources
      - path: TERMS_OF_SERVICE.md
        buildPhase: resources
    dependencies:
      - target: CoherenceWatch
        embed: true
      - package: PostHog
      - package: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockout.meditate808
        INFOPLIST_FILE: Coherence/Info.plist
        CODE_SIGN_ENTITLEMENTS: Coherence/Coherence.entitlements
        # iPhone only. 808 is an iPhone and Apple Watch product: there is no
        # iPad layout, nobody has tested one, and claiming iPad support made
        # App Store Connect reject the upload (90474), because an iPad app
        # must offer all four orientations for multitasking and this one is
        # portrait. Anchored to the iOS target only; watchOS is family 4.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.10"
    postBuildScripts:
      # AIRPODS PROBE, DEBUG ONLY (2026-09-14). CMHeadphoneMotionManager
      # crashes the app when NSMotionUsageDescription is missing, and the probe
      # in Coherence/AirPods/ is compiled only into Debug. INFOPLIST_KEY_*
      # settings are ignored while GENERATE_INFOPLIST_FILE is NO (verified on
      # the built product), so the string is written into the BUILT Debug
      # Info.plist here, after the phases and before code signing. The
      # committed Coherence/Info.plist and every Release build are untouched.
      # If the AirPods path ever ships, the string moves into Info.plist, and
      # that change forces a fresh App Review pass (usage strings are reviewed).
      - name: "AirPods probe: Debug-only motion usage string"
        # The input file orders this phase AFTER Xcode's Info.plist processing;
        # without it the phase ran first and the processed plist overwrote it.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            TEXT="808 reads head motion from your AirPods during this developer test."
            /usr/libexec/PlistBuddy -c "Set :NSMotionUsageDescription ${TEXT}" "${PLIST}" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :NSMotionUsageDescription string ${TEXT}" "${PLIST}"
          fi

  CoherenceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - CoherenceWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockout.meditate808.watchkitapp
        WKCompanionAppBundleIdentifier: com.lockout.meditate808
        INFOPLIST_FILE: CoherenceWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoherenceWatch/CoherenceWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO

  CoherenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CoherenceTests
      - Shared
    dependencies:
      - target: Coherence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lockout.meditate808.tests

schemes:
  Coherence:
    build:
      targets:
        Coherence: all
        CoherenceTests: [test]
    test:
      targets:
        - CoherenceTests
    run:
      config: Debug
  CoherenceWatch:
    build:
      targets:
        CoherenceWatch: all
    run:
      config: Debug
